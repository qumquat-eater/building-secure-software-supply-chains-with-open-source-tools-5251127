name: FB Security Pipeline

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on:
      ubuntu-latest
    steps:
    - uses: actions/checkout@v4
  
  trivy_container_scan:
    runs-on:
      ubuntu-latest
    needs: 'setup'
    steps:
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'bkimminich/juice-shop'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
